<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar Agendamento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2>Confirmar Agendamento</h2>

                <p><strong>Serviço:</strong> {{ servico[1] }}</p>
                <p><strong>Duração:</strong> {{ servico[2] }} minutos</p>
                <p><strong>Valor:</strong> R$ {{ "%.2f"|format(servico[3]) }}</p>
                <p><strong>Data:</strong> {{ data }}</p>
                <p><strong>Horário:</strong> {{ hora }}</p>

                {% if erro %}
                <div class="alert alert-danger">{{ erro }}</div>
                {% endif %}

                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="servico" value="{{ servico[0] }}">
                    <input type="hidden" name="data" value="{{ data }}">
                    <input type="hidden" name="hora" value="{{ hora }}">

                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome completo</label>
                        <input class="form-control" type="text" id="nome" name="nome"
                            value="{{ request.form.get('nome', '') }}" maxlength="100" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="telefone">Telefone com DDD</label>
                        <input class="form-control" type="tel" id="telefone" name="telefone"
                            value="{{ request.form.get('telefone', '') }}" placeholder="62999999999" required>
                    </div>

                    <button class="btn btn-success" type="submit">
                        Confirmar Agendamento
                    </button>

                    <a href="/disponibilidade" class="btn btn-secondary">
                        Voltar
                    </a>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
