{% extends "base.html" %}
{% block title %}Editar Serviço{% endblock %}
{% block content %}
<div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h1 class="mb-4">Editar Serviço</h1>

                    {% if erro %}
                    <div class="alert alert-danger">
                        {{ erro }}
                    </div>
                    {% endif %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token }}"
                        >

                        <div class="mb-3">
                            <label for="nome" class="form-label">
                                Nome do serviço
                            </label>

                            <input
                                id="nome"
                                type="text"
                                name="nome"
                                class="form-control"
                                value="{{ servico[1] }}"
                                maxlength="100"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">
                                Preço (R$)
                            </label>

                            <input
                                id="preco"
                                type="number"
                                name="preco"
                                class="form-control"
                                value="{{ servico[2] }}"
                                min="0"
                                step="0.01"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="duracao" class="form-label">
                                Duração (minutos)
                            </label>

                            <input
                                id="duracao"
                                type="number"
                                name="duracao"
                                class="form-control"
                                value="{{ servico[3] }}"
                                min="1"
                                step="1"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Salvar Alterações
                        </button>

                        <a href="/servicos" class="btn btn-secondary">
                            Cancelar
                        </a>

                    </form>

                </div>
            </div>

        </div>
    </div>
{% endblock %}
