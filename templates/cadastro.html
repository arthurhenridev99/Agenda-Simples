<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro da Profissional</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Cadastro da Profissional
                        </h2>

                        {% if cadastro_existente %}

                            <div class="alert alert-info">
                                Já existe uma profissional cadastrada.
                            </div>

                        {% else %}

                            {% if erro %}
                                <div class="alert alert-danger">
                                    {{ erro }}
                                </div>
                            {% endif %}

                            {% if sucesso %}
                                <div class="alert alert-success">
                                    {{ sucesso }}
                                </div>
                            {% else %}

                                <form method="POST">

                                    <div class="mb-3">
                                        <label class="form-label">
                                            Nome completo
                                        </label>
                                        <input
                                            type="text"
                                            name="nome"
                                            class="form-control"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">
                                            Login
                                        </label>
                                        <input
                                            type="text"
                                            name="login"
                                            class="form-control"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">
                                            Senha
                                        </label>
                                        <input
                                            type="password"
                                            name="senha"
                                            class="form-control"
                                            minlength="8"
                                            required
                                        >
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">
                                            Confirmar senha
                                        </label>
                                        <input
                                            type="password"
                                            name="confirmar_senha"
                                            class="form-control"
                                            minlength="8"
                                            required
                                        >
                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn-primary w-100"
                                    >
                                        Realizar Cadastro
                                    </button>

                                </form>

                            {% endif %}

                        {% endif %}

                        <a
                            href="/"
                            class="d-block text-center mt-3"
                        >
                            Voltar à página inicial
                        </a>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
