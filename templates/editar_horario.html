{% extends "base.html" %}
{% block title %}Editar Horário{% endblock %}
{% block content %}
<div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="mb-4">Editar Horário</h1>

                        {% if erro %}
                        <div class="alert alert-danger">
                            {{ erro }}
                        </div>
                        {% endif %}

                        <form method="POST">

                            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                            <div class="mb-3">
                                <label for="dia_semana" class="form-label">
                                    Dia da semana
                                </label>

                                <select id="dia_semana" name="dia_semana" class="form-select" required>

                                    {% for dia in dias_semana %}
                                    <option value="{{ loop.index0 }}" {% if loop.index0==horario[1] %} selected {% endif
                                        %}>
                                        {{ dia }}
                                    </option>
                                    {% endfor %}

                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="hora_inicio" class="form-label">
                                    Horário de início
                                </label>

                                <input id="hora_inicio" type="time" name="hora_inicio" class="form-control"
                                    value="{{ horario[2] }}" required>
                            </div>

                            <div class="mb-3">
                                <label for="hora_fim" class="form-label">
                                    Horário de término
                                </label>

                                <input id="hora_fim" type="time" name="hora_fim" class="form-control"
                                    value="{{ horario[3] }}" required>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                Salvar Alterações
                            </button>

                            <a href="/horarios" class="btn btn-secondary">
                                Cancelar
                            </a>

                        </form>

                    </div>
                </div>

            </div>
        </div>
{% endblock %}
