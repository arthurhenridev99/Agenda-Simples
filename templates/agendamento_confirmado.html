<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agendamento Confirmado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5" style="max-width: 700px;">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h2 class="text-success">
                    Agendamento Confirmado!
                </h2>

                <p>Seu atendimento foi registrado com sucesso.</p>

                <p><strong>Serviço:</strong> {{ agendamento[0] }}</p>
                <p><strong>Data:</strong> {{ agendamento[1] }}</p>
                <p><strong>Horário:</strong> {{ agendamento[2] }}</p>

                <div class="alert alert-info">
                    <p class="mb-1">Código de atendimento</p>
                    <h3 class="mb-0">{{ agendamento[3] }}</h3>
                </div>

                <p class="text-muted">
                    Guarde este código para consultar seu agendamento.
                </p>

                <a href="/" class="btn btn-primary">
                    Voltar ao início
                </a>
            </div>
        </div>
    </main>
</body>

</html>
