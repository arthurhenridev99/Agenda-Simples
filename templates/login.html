{% extends "base.html" %}
{% block title %}Login da Profissional{% endblock %}
{% block content %}
<div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="text-center mb-4">
                            Login da Profissional
                        </h1>

                        {% if erro %}
                            <div class="alert alert-danger">
                                {{ erro }}
                            </div>
                        {% endif %}

                        <form method="POST">

                            <div class="mb-3">
                                <label class="form-label" for="login">
                                    Login
                                </label>

                                <input id="login"
                                    type="text"
                                    name="login"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="senha">
                                    Senha
                                </label>

                                <input id="senha"
                                    type="password"
                                    name="senha"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Entrar
                            </button>

                        </form>

                        <a
                            href="/"
                            class="d-block text-center mt-3"
                        >
                            Voltar à página inicial
                        </a>

                    </div>
                </div>

            </div>
        </div>
    <p class="text-center mt-3"><a href="{{ url_for('cadastro') }}">Configurar primeiro acesso</a></p>
{% endblock %}
