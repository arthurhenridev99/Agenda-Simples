{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-intro"><h1>AgendaSimples</h1><p class="text-muted">Sua agenda, mais simples.</p></div>
<section class="card auth-card"><div class="card-body">
  <h2 class="text-center">Entrar</h2><p class="text-center text-muted mb-4">Entre com suas credenciais para acessar o painel</p>
  {% if erro %}<div class="alert alert-danger" role="alert">{{ erro }}</div>{% endif %}
  <form method="POST">
    <div class="mb-3"><label for="login">E-mail ou login</label><input id="login" name="login" class="form-control" autocomplete="username" placeholder="seu@email.com" value="{{ request.form.get('login', '') }}" required></div>
    <div class="mb-3"><label for="senha">Senha</label><div class="password-field"><input id="senha" name="senha" type="password" class="form-control" autocomplete="current-password" required><button type="button" class="password-toggle" data-password="senha" aria-label="Mostrar senha" aria-pressed="false" hidden>Mostrar</button></div></div>
    <button class="btn btn-primary w-100" type="submit">Entrar</button>
  </form>
  <p class="text-center mt-3 mb-0">Não tem uma conta? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
  <a class="d-block text-center mt-3" href="{{ url_for('esqueci_minha_senha') }}">Esqueci minha senha</a>
</div></section>
<script src="{{ url_for('static', filename='js/senhas.js') }}" defer></script>
{% endblock %}
